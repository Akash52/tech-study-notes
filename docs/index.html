<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Study Notes</title>
  <script>
    /* Applies the saved theme before any stylesheet paints. This MUST stay
       inline and in <head>: an external script runs after the CSS has already
       rendered, which shows a flash of the wrong theme on every page load.
       Key and values are mirrored in theme-toggle.js - change both together.
       Absent/invalid means "system", which leaves data-theme unset so the
       prefers-color-scheme media queries decide. */
    (function () {
      try {
        var t = localStorage.getItem('tsn.theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="custom.css">
  <link rel="stylesheet" href="command-palette.css">
  <link rel="stylesheet" href="progress-tracker.css">
  <link rel="stylesheet" href="theme-toggle.css">
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Tech Study Notes',
      repo: 'Akash52/tech-study-notes',
      // Docsify walks up from the current page's directory looking for a
      // _sidebar.md at each level, falling back to the root one - so nested
      // pages will 404 for e.g. tools/_sidebar.md before landing on this one.
      // That's Docsify's own designed fallback (it supports per-folder
      // sidebars), not a bug: harmless, invisible to users, devtools-only.
      loadSidebar: '_sidebar.md',
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false,
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true
      }
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="custom.js"></script>
  <!-- Command palette search (replaces the docsify-search plugin) -->
  <script src="command-palette.js"></script>
  <!-- Study progress tracking (localStorage) -->
  <script src="progress-tracker.js"></script>
  <!-- Light/dark theme switcher -->
  <script src="theme-toggle.js"></script>
  <!-- Sidebar labels + home page presentation -->
  <script src="nav.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-jsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
